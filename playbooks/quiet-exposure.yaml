id: quiet-exposure
label: 悄悄露出
aliases: [半公共露出, 差一点被发现]
core_tension: 当事人想制造被看见的可能，又承担不起真正暴露
setting: [深夜洗衣房, 便利店角落, 公交站, 消防通道, 停车场]
progression:
  - 用普通动作制造第一道遮挡缺口
  - 当事人确认外界暂时没人
  - 主动扩大一点风险
  - 声音、脚步或倒影逼近
  - 收住或继续，必须做出选择
turn: 路人停留、门开、灯亮、镜头转向，或当事人发现自己希望被看见
ending_modes:
  - 整理衣物后回到日常
  - 留下一个可能暴露的物件
  - 下一次主动回到同一地点
dialogue_vectors: [遮掩, 试探, 自嘲, 警告]
avoid: [路人只负责观看, 每段报羞耻, 固定高潮链, 把风险当安全]
profile_modules: [adult-adventure]
