id: mirror
label: 镜面自看
aliases: [玻璃倒影, 自我观看]
core_tension: 看见自己失控，比被别人看见更直接
setting: [试衣间, 浴室, 酒店镜前, 关灯后的车窗]
progression:
  - 先注意到脸或衣着的异常
  - 再看空间倒影
  - 动作被倒影放大
  - 发现外界倒影进入画面
  - 选择看或不看
turn: 镜子里出现第二个人；玻璃暴露外面的街；人物发现自己一直在等这一刻
ending_modes: [遮住镜面, 留下痕迹, 离开前再看一眼]
avoid: [连续“镜中人”, 诗意化身体, 大段心理总结]
profile_modules: []
