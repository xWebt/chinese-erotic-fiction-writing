[project]
name = "chinese-fiction-harness"
version = "0.1.0"
description = "CLI harness for Chinese erotic fiction writing with DeepSeek API"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "jieba>=0.42.1",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "click>=8.0.0",
]

[project.scripts]
novel = "harness.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
