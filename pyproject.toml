[project]
name = "chinese-fiction-harness"
version = "0.1.0"
description = "Local CLI tools for Chinese erotic fiction writing assistance"
requires-python = ">=3.10"
dependencies = [
    "jieba>=0.42.1",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "click>=8.0.0",
]

[project.scripts]
novel = "harness.cli:main"

[tool.setuptools]
# Flat-layout auto-discovery would pick up sessions/ and references/ as
# top-level packages and abort the build. Only `harness` is a Python package;
# the rest are data directories the Agent reads from the repo.
packages = ["harness"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
